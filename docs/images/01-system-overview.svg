<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#07111f"/>
  <text x="60" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="38" font-weight="700">AEGIS Web Continuation - System Overview</text>
  <text x="60" y="112" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22">Workflow guidance and identity checks stay separate from repository execution.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="220" width="225" height="160" rx="24" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
    <text x="182" y="280" fill="#dbeafe" font-size="28" font-weight="700">Phone / Web</text>
    <text x="182" y="320" fill="#bfdbfe" font-size="20">Chat or Work</text>
    <text x="182" y="350" fill="#93c5fd" font-size="17">Start and review anywhere</text>
    <rect x="355" y="220" width="225" height="160" rx="24" fill="#052e2b" stroke="#2dd4bf" stroke-width="3"/>
    <text x="467" y="275" fill="#ccfbf1" font-size="27" font-weight="700">AEGIS Skill</text>
    <text x="467" y="315" fill="#99f6e4" font-size="19">Identity - Scope - Evidence</text>
    <text x="467" y="347" fill="#5eead4" font-size="17">Approval and verification</text>
    <rect x="640" y="220" width="225" height="160" rx="24" fill="#3b1d0b" stroke="#fb923c" stroke-width="3"/>
    <text x="752" y="280" fill="#ffedd5" font-size="28" font-weight="700">Codex Cloud</text>
    <text x="752" y="320" fill="#fed7aa" font-size="20">Repository executor</text>
    <text x="752" y="350" fill="#fdba74" font-size="17">Inspect - Edit - Build - Test</text>
    <rect x="925" y="220" width="225" height="160" rx="24" fill="#1e293b" stroke="#cbd5e1" stroke-width="3"/>
    <text x="1037" y="280" fill="#f8fafc" font-size="28" font-weight="700">GitHub</text>
    <text x="1037" y="320" fill="#e2e8f0" font-size="20">Branch - Commit - PR</text>
    <text x="1037" y="350" fill="#cbd5e1" font-size="17">Shared source of truth</text>
    <path d="M295 300 H340" stroke="#60a5fa" stroke-width="6"/>
    <polygon points="340,300 326,291 326,309" fill="#60a5fa"/>
    <path d="M580 300 H625" stroke="#2dd4bf" stroke-width="6"/>
    <polygon points="625,300 611,291 611,309" fill="#2dd4bf"/>
    <path d="M865 300 H910" stroke="#fb923c" stroke-width="6"/>
    <polygon points="910,300 896,291 896,309" fill="#fb923c"/>
  </g>
  <rect x="70" y="470" width="1080" height="120" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="100" y="515" fill="#fbbf24" font-family="Arial, sans-serif" font-size="23" font-weight="700">Important boundary</text>
  <text x="100" y="553" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20">The Skill does not grant GitHub, shell, credential, merge, deploy, or extra usage quota.</text>
  <text x="100" y="580" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">Execution is available only when the active ChatGPT/Codex environment already has the required authorized tools.</text>
</svg>

