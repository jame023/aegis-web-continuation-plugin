<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#07111f"/>
  <text x="60" y="72" fill="#f8fafc" font-family="Arial, sans-serif" font-size="38" font-weight="700">When Codex CLI Cannot Continue</text>
  <text x="60" y="112" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22">The Skill preserves workflow state; it does not bypass usage limits.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="455" y="150" width="290" height="80" rx="20" fill="#3b1d0b" stroke="#fb923c" stroke-width="3"/>
    <text x="600" y="199" fill="#ffedd5" font-size="25" font-weight="700">CLI unavailable</text>
    <path d="M600 230 V280" stroke="#94a3b8" stroke-width="5"/>
    <polygon points="600,280 590,263 610,263" fill="#94a3b8"/>
    <rect x="415" y="280" width="370" height="80" rx="20" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
    <text x="600" y="328" fill="#dbeafe" font-size="24">Latest checkpoint on GitHub?</text>
    <path d="M415 320 H250 V420" stroke="#ef4444" stroke-width="5"/>
    <text x="325" y="302" fill="#fca5a5" font-size="18">NO</text>
    <path d="M785 320 H950 V420" stroke="#2dd4bf" stroke-width="5"/>
    <text x="875" y="302" fill="#99f6e4" font-size="18">YES</text>
    <rect x="75" y="420" width="350" height="115" rx="20" fill="#450a0a" stroke="#ef4444" stroke-width="3"/>
    <text x="250" y="465" fill="#fee2e2" font-size="24" font-weight="700">BLOCKED_STALE_STATE</text>
    <text x="250" y="501" fill="#fecaca" font-size="18">PC must publish a checkpoint</text>
    <rect x="775" y="420" width="350" height="115" rx="20" fill="#052e2b" stroke="#2dd4bf" stroke-width="3"/>
    <text x="950" y="462" fill="#ccfbf1" font-size="24" font-weight="700">Validate Web capability</text>
    <text x="950" y="495" fill="#99f6e4" font-size="18">Executor tools? Continue.</text>
    <text x="950" y="520" fill="#5eead4" font-size="18">Read-only? Create handoff.</text>
  </g>
  <rect x="360" y="575" width="480" height="55" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="600" y="610" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20">Never claim execution without diff and test evidence.</text>
</svg>
